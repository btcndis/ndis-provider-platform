[project]
name = "ndis-commission-crawl4ai"
version = "0.1.0"
description = "Dedicated resumable Crawl4AI acquisition adapter for every public NDIS Commission PDF"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Veritaxon" }]
dependencies = [
  "crawl4ai==0.9.2",
  "httpx[http2]>=0.28,<0.29",
  "beautifulsoup4>=4.14,<5",
  "lxml>=6,<7",
  "defusedxml>=0.7,<1",
]

[project.scripts]
ndis-commission-crawl = "ndis_commission_crawler.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndis_commission_crawler"]
